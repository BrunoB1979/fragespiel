<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frage</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="container">
        <header id="header">
            <div id="progress">
                Frage <span id="currentQuestion">1</span> von <span id="totalQuestions">5</span>
            </div>
        </header>
        <main id="main-content">
            <div id="question-container">
                <h2 id="question">Frage wird geladen...</h2>
            </div>
            <div id="options">
                <!-- Antwortbuttons werden hier dynamisch eingefügt -->
            </div>
        </main>
        <footer id="footer">
            <img src="assets/images/question-icon.svg" alt="Frage-icon" id="document-icon">
        </footer>
    </div>

    <script src="assets/js/frage.js"></script>
</body>
</html>
